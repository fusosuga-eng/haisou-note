<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配送ノート</title><style>body{margin:0;background:#f3f5f7;color:#182230;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif}main{max-width:560px;margin:auto;padding:18px}h1{font-size:24px;margin:8px 0 4px}.sub{color:#667085;font-size:13px;margin-bottom:20px}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #00000009}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.title{font-weight:800;font-size:19px}.pill{font-size:12px;background:#eef2f6;border-radius:30px;padding:6px 10px}.btn{border:0;border-radius:11px;padding:13px 12px;font-size:15px;font-weight:700;cursor:pointer;background:#e9eef4;color:#1d2939}.primary{background:#1769e0;color:white}.done{background:#d8f5e5;color:#087443}.buttons{display:flex;gap:8px;margin-top:14px}.buttons button{flex:1}.details{margin-top:12px;border-top:1px solid #eee;padding-top:10px}.item{padding:10px 0;border-bottom:1px solid #f0f0f0;font-size:14px}.item:last-child{border:0}.small{font-size:12px;color:#667085}.link{border:0;background:none;color:#1769e0;font-size:14px;padding:10px 0;cursor:pointer}.top{display:flex;align-items:center;gap:10px;margin:10px 0}.top input{flex:1;padding:10px;border:1px solid #ddd;border-radius:10px;font-size:16px}.note{font-size:12px;color:#667085;line-height:1.6}.hidden{display:none}dialog{border:0;border-radius:16px;padding:22px;width:min(88vw,420px)}dialog input,dialog select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:7px 0 12px;font-size:16px}dialog label{font-size:13px;font-weight:700}dialog::backdrop{background:#0007}.supply{background:#fff8e9;border:1px solid #f7dda4;border-radius:12px;padding:12px;margin-top:12px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.checks label{background:#fff;padding:12px;border-radius:9px;font-size:14px}.checks input{width:19px;height:19px;vertical-align:middle}.footer{margin:20px 0}.secondary{font-size:13px}</style></head><body><main><h1>🚚 配送ノート</h1><div class="sub">便ごとに、積込・納品を押すだけ</div><div class="top"><button class="btn" id="prev">‹</button><input type="date" id="date"><button class="btn" id="next">›</button></div><div id="app"></div><button class="btn primary" id="add" style="width:100%;margin-top:8px">＋ 荷物を追加</button><div class="footer"><button class="link" id="tomorrow">翌営業日の予定を表示 →</button><div class="note">※試作版です。データはこのブラウザ内だけに保存されます。Gmail・カレンダーとは未接続です。サプライのチェックはこの端末で操作する本人用です。</div></div></main><dialog id="dlg"><form id="form"><h2>荷物を追加</h2><label>便</label><select name="run"><option>朝イチ便</option><option>7時便</option><option>午後一便</option></select><label>行き先・品名</label><input name="name" placeholder="例：PK 針葉樹合板" required maxlength="100"><label>メモ（任意）</label><input name="memo" placeholder="例：300枚" maxlength="100"><div class="buttons"><button type="button" class="btn" id="cancel">やめる</button><button class="btn primary">追加する</button></div></form></dialog><script>
const runs=['朝イチ便','7時便','午後一便'];const key='delivery-note-simple-v1';let store={};try{store=JSON.parse(localStorage.getItem(key))||{}}catch{};const $=x=>document.getElementById(x);const localDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;let date=localDate(new Date());$('date').value=date;function save(){localStorage.setItem(key,JSON.stringify(store))}function get(){return store[date]||(store[date]={runs:{},items:[]})}function state(r){let a=get();return a.runs[r]||(a.runs[r]={loaded:false,delivered:false,supply:[false,false,false,false]})}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const a=get();$('app').innerHTML=runs.map((r,i)=>{const s=state(r),items=a.items.filter(x=>x.run===r),all=s.supply.every(Boolean),hasSupply=r==='朝イチ便';return `<section class="card"><div class="row"><div class="title">${['🌅','🚛','📦'][i]} ${r}</div><span class="pill">${s.delivered?'納品完了':s.loaded?'積込完了':'未積込'}</span></div><div class="buttons"><button class="btn ${s.loaded?'done':'primary'}" data-act="load" data-run="${r}" ${hasSupply&&!all&&!s.loaded?'disabled title="サプライチェックが必要"':''}>${s.loaded?'✓ 積込完了':'積込完了'}</button><button class="btn ${s.delivered?'done':'primary'}" data-act="deliver" data-run="${r}" ${!s.loaded?'disabled':''}>${s.delivered?'✓ 納品完了':'納品完了'}</button></div><button class="link" data-act="toggle" data-run="${r}">荷物を見る（${items.length}件） ▾</button><div class="details hidden" id="details${i}">${items.length?items.map(x=>`<div class="item"><div class="row"><span><b>${esc(x.name)}</b>${x.memo?`<div class="small">${esc(x.memo)}</div>`:''}</span><button class="link" data-act="remove" data-id="${x.id}">削除</button></div></div>`).join(''):'<div class="small">登録された荷物はありません</div>'}${hasSupply?`<div class="supply"><b>サプライ専用チェック</b><div class="small">4項目すべて完了で積込ボタンが押せます</div><div class="checks">${['作業者','ドライバー','工場長','宵積み'].map((v,n)=>`<label><input type="checkbox" data-act="check" data-n="${n}" ${s.supply[n]?'checked':''}> ${v}</label>`).join('')}</div><div class="small">※チェック項目名・順番は今後調整できます</div></div>`:''}</div></section>`}).join('');document.querySelectorAll('[data-act]').forEach(el=>el.addEventListener('click',e=>{const act=el.dataset.act,r=el.dataset.run;if(act==='toggle'){$('details'+runs.indexOf(r)).classList.toggle('hidden');return}if(act==='check'){state('朝イチ便').supply[+el.dataset.n]=el.checked;save();const idx=runs.indexOf('朝イチ便');render();$('details'+idx).classList.remove('hidden');return}if(act==='remove'){if(confirm('この荷物を削除しますか？')){get().items=get().items.filter(x=>String(x.id)!==el.dataset.id);save();render()}return}let s=state(r);if(act==='load'){s.loaded=!s.loaded;if(!s.loaded)s.delivered=false}if(act==='deliver')s.delivered=!s.delivered;save();render()}))}function shift(n){let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);date=localDate(d);$('date').value=date;render()}$('prev').onclick=()=>shift(-1);$('next').onclick=()=>shift(1);$('date').onchange=e=>{date=e.target.value;render()};$('tomorrow').onclick=()=>{let d=new Date(date+'T12:00:00');do{d.setDate(d.getDate()+1)}while([0,6].includes(d.getDay()));date=localDate(d);$('date').value=date;render()};$('add').onclick=()=>$('dlg').showModal();$('cancel').onclick=()=>$('dlg').close();$('form').onsubmit=e=>{e.preventDefault();let fd=new FormData(e.target);get().items.push({id:Date.now()+Math.random(),run:fd.get('run'),name:fd.get('name').trim(),memo:fd.get('memo').trim()});save();$('dlg').close();e.target.reset();render()};render();</script></body></html>
